aid: ferry
name: Ferry
description: >-
  Ferry (operated by ThirdRails Ltd) is a London-based development and data
  integration platform for the industrial edge, founded in 2023 by Dominic Aits
  and Ethan Waldie. Ferry lets operations, IT and data teams in operationally
  intensive industries — manufacturing, energy, oil & gas and pharmaceuticals —
  integrate data from factory floors and frontline operations directly into
  their IT systems, and build, deploy and monitor custom edge applications and
  data pipelines on industrial hardware. It ships as a modular Manufacturing
  Execution System (MES) with agentic AI for production scheduling, supply chain
  operations, troubleshooting, real-time process guidance and continuous
  improvement, deploying via AWS IoT Greengrass in the customer's own AWS account
  or Azure IoT Edge in their Azure account. Ferry is backed by Seedcamp,
  Asymmetric Capital Partners and Target Global, and is SOC 2 Type II certified.
